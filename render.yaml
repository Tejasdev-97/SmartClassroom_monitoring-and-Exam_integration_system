services:
  - type: web
    name: examproctor-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: "cd backend && pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: DATABASE_URL
        fromDatabase:
          name: examproctor-postgres
          property: connectionString
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: examproctor-postgres
          property: connectionString
      - key: CLASSROOM_DATABASE_URL
        fromDatabase:
          name: examproctor-postgres
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "http://localhost:5173,https://*.vercel.app"
      - key: SNAPSHOT_STORAGE_TYPE
        value: local
      - key: SNAPSHOT_LOCAL_DIR
        value: ./storage/snapshots
      - key: CLIP_STORAGE_BACKEND
        value: local
      - key: CLIP_LOCAL_DIR
        value: ./storage/clips
      - key: STUN_SERVER_URL
        value: "stun:stun.l.google.com:19302"
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: "admin@examproctor.ai"
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

databases:
  - name: examproctor-postgres
    databaseName: examproctor
    user: examproctor
    plan: starter
    region: oregon
